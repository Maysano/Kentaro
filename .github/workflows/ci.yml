name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standard Kentaro dependencies
        run: python -m pip install .
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build checks
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Install and smoke-test the standard wheel
        run: python -m unittest tests.test_distribution_install -v
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kentaro-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  platform-distribution-smoke:
    name: Installed standard wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and smoke-test the wheel as a learner would
        run: python -m unittest tests.test_distribution_install -v
